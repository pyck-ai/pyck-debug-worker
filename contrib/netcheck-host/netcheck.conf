# nginx site for a dedicated netcheck endpoint (plain Ubuntu, nginx from apt).
# Install: /etc/nginx/sites-available/netcheck, symlinked into sites-enabled,
# with the distro "default" site removed. See README.md next to this file.

# Port 80 exists only for Let's Encrypt HTTP-01 validation and renewal.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}

server {
    # default_server: answer every SNI (and no SNI), so the worker's
    # SNI-alternation and bare-IP checks hit this block too.
    # "listen ... http2" instead of "http2 on;" keeps nginx 1.24 (Ubuntu 24.04) working.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Symlinks to the Let's Encrypt certificate for this host (see README).
    # The worker verifies it, so a TLS-intercepting middlebox is detected.
    ssl_certificate     /etc/nginx/netcheck/cert.pem;
    ssl_certificate_key /etc/nginx/netcheck/key.pem;

    # Idle-survival gaps go up to 30 min; the default 75s would close them
    # first and we'd measure nginx, not the network. keepalive_time stays at
    # its 1h default (the worker logs that close as server-closed).
    keepalive_timeout 1h;

    access_log off;
    gzip off;

    location = /static/netcheck/1m.bin {
        root /var/www/netcheck;
        default_type application/octet-stream;
    }

    location / {
        return 404;
    }
}
