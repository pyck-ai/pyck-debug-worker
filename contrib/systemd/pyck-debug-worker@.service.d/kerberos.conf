# Drop-in for the print check (--print).
#
# This is a drop-in and not part of the base unit on purpose:
# LoadCredentialEncrypted= has no optional form, so putting it in the base unit
# would break every instance that does not print. Install it only on the hosts
# that should print.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/pyck-debug-worker@.service.d
#   sudo install -m 0644 kerberos.conf \
#        /etc/systemd/system/pyck-debug-worker@.service.d/kerberos.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart pyck-debug-worker@test.service
#
# Seal the keytab first (RHEL 9, systemd 252):
#   systemd-creds encrypt --name=krb5-keytab svc.keytab \
#       /etc/credstore.encrypted/krb5-keytab
#   shred -u svc.keytab
# Add --with-key=host on VMs with no vTPM; the default 'auto' fails there.
#
# ROTATION TRAP: credentials are snapshotted when the unit starts. After SSSD
# rotates a managed service account's key, the next Kerberos login fails with
# KDC_ERR_PREAUTH_FAILED until the unit is restarted. Restart it; do not debug
# it.
#
# WARNING: with this drop-in and --print, every start of the unit puts a page
# in a physical printer's output tray.

[Service]
# Decrypted into non-swappable memory for this unit's UID only, and exposed as
# $CREDENTIALS_DIRECTORY/krb5-keytab, which is where the binary looks by
# default. Works with the base unit's DynamicUser=yes: systemd applies the
# credential to the ephemeral UID.
LoadCredentialEncrypted=krb5-keytab:/etc/credstore.encrypted/krb5-keytab

# --print fires once, after the first cycle. It is never on the loop.
ExecStart=
ExecStart=/usr/local/bin/pyck-debug-worker --env %i --print

# The print server, the share and the principal. The keytab itself is never
# named here: it arrives as the credential above. A keytab path or any secret
# in Environment= would be readable from /proc.
Environment=PYCK_PRINT_SERVER=print01.corp.example.com
Environment=PYCK_PRINT_SHARE=Reception
Environment=PYCK_KRB5_PRINCIPAL=svc-pyck-probe@CORP.EXAMPLE.COM
Environment=KRB5_CONFIG=/etc/krb5.conf

# The base unit restricts address families to IP; Kerberos and SMB need
# nothing beyond that. ProtectSystem=strict still allows reading /etc/krb5.conf.
