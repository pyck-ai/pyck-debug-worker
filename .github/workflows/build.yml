name: Build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pyck-ai/pyck-debug-worker:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/pyck-ai/pyck-debug-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/pyck-ai/pyck-debug-worker:buildcache,mode=max
