name: Build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # contents: read is required for actions/checkout. Declaring any permissions
  # block sets every unlisted scope to none, so omitting it makes checkout fail
  # with "Repository not found" on a private repo.
  contents: read
  packages: write

jobs:
  build:
    runs-on: [pyck-ai, firecracker, standard, docker, buildkit]
    steps:
      - uses: actions/checkout@v4

      - name: wait for podman
        run: runner-init --wait podman 120

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A remote builder on the runner's rootless BuildKit: the default
      # docker-container builder cannot start on rootless podman. The build
      # step below uses it because --use makes it the current builder.
      - name: set up buildx (the runner's rootless BuildKit)
        run: |
          runner-init --wait buildkit 180
          docker buildx create --name ci --driver remote --use \
            "${BUILDKIT_HOST:?runner-init is present but BUILDKIT_HOST is not set}"
          docker buildx inspect ci --bootstrap

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pyck-ai/pyck-debug-worker:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/pyck-ai/pyck-debug-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/pyck-ai/pyck-debug-worker:buildcache,mode=max
